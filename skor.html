<style>
/* Layout: one working column — scoreboard (2×2 seats) on top, hand entry card, payment preview, then history. Jade felt + ivory tiles + gold trim, same as the Jade Mahjong books. */
:root{
  --bg:#f3efe3; --card:#fffdf7; --ink:#1f2620; --mut:#63675d; --line:#ddd4bd;
  --jade:#145a43; --jade-d:#0d3f2f; --jade-soft:#e3efe8; --gold:#a8832f; --gold-tx:#86671f;
  --win:#1b7a4c; --lose:#b23a2a; --chip:#f6f1e3;
  --disp:'Cormorant Garamond',Georgia,serif; --body:'IBM Plex Sans',system-ui,sans-serif; --cjk:'Noto Serif TC','Noto Serif CJK TC',serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1a15; --card:#13251e; --ink:#ece6d6; --mut:#a4ad9f; --line:#2a4036;
  --jade:#4fb48a; --jade-d:#8fd6b5; --jade-soft:#18382c; --gold:#d2ae5c; --gold-tx:#d9b968;
  --win:#5fd39a; --lose:#f08a78; --chip:#1a3027; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1a15; --card:#13251e; --ink:#ece6d6; --mut:#a4ad9f; --line:#2a4036;
  --jade:#4fb48a; --jade-d:#8fd6b5; --jade-soft:#18382c; --gold:#d2ae5c; --gold-tx:#d9b968;
  --win:#5fd39a; --lose:#f08a78; --chip:#1a3027; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 48px;display:grid;gap:18px}
header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 18px}
.brand small{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold-tx);font-weight:600}
.brand h1{font-family:var(--disp);font-size:34px;line-height:1.05;margin:2px 0 0;color:var(--jade-d);text-wrap:balance}
.variants{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.pill{border:1.5px solid var(--line);background:var(--card);border-radius:99px;padding:6px 13px;font-weight:600;font-size:14px}
.pill[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--card)}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;padding:16px}
h2{font-family:var(--disp);font-size:25px;margin:0;color:var(--jade-d);line-height:1.1}
.label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-tx);font-weight:600;margin:0 0 6px}
.num{font-variant-numeric:tabular-nums}

/* scoreboard */
.board{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:720px){.board{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seat{position:relative;padding:12px 12px 10px}
.seat.dealer{border-color:var(--jade);box-shadow:0 0 0 2px var(--jade-soft)}
.seat-top{display:flex;align-items:center;gap:8px}
.wind{font-family:var(--cjk);font-weight:700;width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--jade-soft);color:var(--jade-d);flex:none;font-size:17px}
.seat input{min-width:0;width:100%;border:0;border-bottom:1.5px dashed var(--line);background:transparent;font:600 15px var(--body);color:var(--ink);padding:3px 0}
.total{font-family:var(--body);font-weight:700;font-size:28px;margin-top:8px;letter-spacing:-.01em}
.total.pos{color:var(--win)} .total.neg{color:var(--lose)}
.badge{position:absolute;top:-9px;right:10px;background:var(--jade);color:var(--card);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:6px;padding:2px 7px}
.seat .mini{margin-top:6px;font-size:12.5px;padding:4px 9px}
.board-foot{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-top:10px;font-size:13.5px;color:var(--mut)}
.board-foot select{font:inherit;border:1.5px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);padding:3px 6px}

/* entry */
.entry{display:grid;gap:16px}
.row{display:grid;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:8px 12px;font-weight:600;font-size:14px;min-width:0}
.opt[aria-pressed="true"]{background:var(--jade);border-color:var(--jade);color:var(--card)}
.opt[disabled]{opacity:.35;cursor:not-allowed}
.items{display:flex;flex-wrap:wrap;gap:6px}
.item{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 10px;font-size:14px;font-weight:500}
.item b{color:var(--gold-tx);font-weight:700}
.item[aria-pressed="true"]{border-color:var(--jade);background:var(--jade-soft);color:var(--jade-d)}
.item.auto{border-style:dashed;cursor:default}
.counter{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--chip);border-radius:10px;padding:3px 4px 3px 10px;font-size:14px}
.counter.on{border-color:var(--jade);background:var(--jade-soft)}
.counter span{margin-right:6px}
.counter button{width:28px;height:28px;border-radius:7px;border:0;background:var(--card);font-weight:700;font-size:16px;color:var(--jade-d)}
.counter output{min-width:20px;text-align:center;font-weight:700}
.stepper{display:inline-flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--chip);font-size:20px;font-weight:700;color:var(--jade-d)}
.stepper input{width:84px;text-align:center;font:700 22px var(--body);border:1.5px solid var(--line);border-radius:10px;padding:5px;background:var(--card);color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:620px){.grid2{grid-template-columns:minmax(0,1fr)}}
.result{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;background:var(--jade-soft);border-radius:14px;padding:14px 16px}
@media (max-width:620px){.result{grid-template-columns:minmax(0,1fr)}}
.value{font-family:var(--disp);font-size:40px;font-weight:700;color:var(--jade-d);line-height:1}
.value small{font-family:var(--body);font-size:14px;font-weight:600;color:var(--mut);margin-left:6px}
.calc{font-size:13.5px;color:var(--mut);margin-top:6px}
.pays{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;min-width:0}
@media (max-width:620px){.pays{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pay{background:var(--card);border-radius:10px;padding:7px 10px;min-width:0}
.pay span{display:block;font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pay b{font-size:18px}
.pos{color:var(--win)} .neg{color:var(--lose)}
.warn{border-left:4px solid var(--lose);background:var(--chip);border-radius:8px;padding:8px 12px;font-size:14px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.primary{background:var(--jade);color:var(--card);border:0;border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px}
.primary[disabled]{opacity:.4;cursor:not-allowed}
.ghost{background:transparent;border:1.5px solid var(--line);border-radius:12px;padding:11px 16px;font-weight:600}
details{border-top:1.5px solid var(--line);padding-top:12px}
summary{cursor:pointer;font-weight:600;color:var(--jade-d)}
.settings{display:flex;flex-wrap:wrap;gap:10px 18px;margin-top:10px;font-size:14px}
.settings label{display:inline-flex;align-items:center;gap:6px}
.settings input[type=number]{width:80px;font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink)}
.settings select{font:inherit;border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--card);color:var(--ink)}

/* history */
.hist{display:grid;gap:6px;margin-top:10px}
.h{display:grid;grid-template-columns:36px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.h .n{font-family:var(--disp);font-size:22px;color:var(--gold-tx);font-weight:700;text-align:center}
.h p{margin:0}
.h .d{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13.5px;margin-top:2px}
.empty{color:var(--mut);font-size:14px;margin-top:8px}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--chip);border-radius:10px;padding:8px 12px;font-size:14px}
.note{font-size:12.5px;color:var(--mut);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <div class="brand"><small><a href="/" style="color:inherit;text-decoration:none">← Jade Mahjong</a> · Penghitung Skor</small><h1 id="vtitle">Hong Kong</h1></div>
    <nav class="variants" id="variants" aria-label="Pilih varian"></nav>
  </header>

  <section class="card room" id="room" aria-label="Room bersama"></section>

  <section class="card" aria-labelledby="sb">
    <p class="label" id="sb">Skor berjalan</p>
    <div class="board" id="board"></div>
    <div class="board-foot" id="boardfoot"></div>
  </section>

  <section class="card entry" aria-labelledby="eh">
    <h2 id="eh">Catat kemenangan</h2>
    <div id="entry" class="entry"></div>
  </section>

  <section class="card" aria-labelledby="hh">
    <div style="display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px">
      <h2 id="hh">Riwayat</h2>
      <div class="actions"><button class="ghost" id="undo">Batalkan terakhir</button><button class="ghost" id="newgame">Permainan baru</button></div>
    </div>
    <div id="confirmbox"></div>
    <div class="hist" id="hist"></div>
  </section>
  <p class="note">Poin hanya untuk skor permainan, bukan taruhan. Data tersimpan di perangkat ini. Room bersama bersifat sementara dan hilang 12 jam setelah tidak dipakai.</p>
</div>

<style>
/* tile entry */
.tl{display:inline-flex;border-radius:7px;line-height:0}
.tl svg{width:30px;height:41px}
.tl.win{box-shadow:0 0 0 3px var(--gold);background:var(--gold)}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.slot{border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;cursor:pointer;background:var(--card);min-width:0}
.slot.active{border:2px solid var(--jade);background:var(--jade-soft)}
.slot.filled{border-style:solid}
.slot-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--mut)}
.slot-t{display:flex;gap:2px;min-height:41px;align-items:center;flex-wrap:wrap}
.slot-t em{font-style:normal;font-size:13px;color:var(--mut)}
.tiny{white-space:nowrap;border:1.5px solid var(--line);background:var(--chip);border-radius:7px;padding:2px 7px;font-size:12px;font-weight:600}
.tiny[aria-pressed="true"]{background:var(--gold);border-color:var(--gold);color:var(--card)}
.pal{display:grid;gap:6px}
.pal-row{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:3px;max-width:400px}
.pal button{border:0;background:transparent;padding:0;border-radius:7px;line-height:0;min-width:0}
.pal button svg{width:100%;height:auto;display:block}
.pal button[disabled]{opacity:.25;cursor:not-allowed}
.chooser{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--chip);border:1.5px solid var(--gold);border-radius:12px;padding:8px 10px}
.chooser button{display:inline-flex;align-items:center;gap:2px;border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:4px 8px 4px 4px;font-size:13px;font-weight:600}
.chooser button .tl svg{width:24px;height:33px}
.status{font-size:14px;font-weight:600;color:var(--jade-d)}
.found{display:flex;flex-wrap:wrap;gap:6px}
.found span{background:var(--jade-soft);color:var(--jade-d);border-radius:9px;padding:5px 10px;font-size:14px;font-weight:600}
.found span b{color:var(--gold-tx);margin-left:4px}
.found span.off{background:var(--chip);color:var(--mut);text-decoration:line-through;font-weight:500}
.ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.info{font-size:13.5px;color:var(--mut)}
.nw{white-space:nowrap}
.chooser button small{font-weight:500;color:var(--mut);font-size:11.5px;margin-left:2px}
.bgrp{display:grid;grid-template-columns:48px minmax(0,1fr);align-items:center;gap:6px;margin-top:6px}
.bgrp>span{font-size:13px;font-weight:600;color:var(--mut)}
.bpal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:280px}
.bpal .bt{border:2px solid transparent;background:transparent;border-radius:9px;padding:2px;display:grid;justify-items:center;gap:2px;min-width:0;line-height:1;opacity:.45}
.bpal .bt svg{width:100%;height:auto;display:block}
.bpal .bt span{font-size:10px;font-weight:600;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bpal .bt[aria-pressed="true"]{opacity:1;border-color:var(--gold);background:var(--jade-soft)}
.bpal .bt[aria-pressed="true"] span{color:var(--jade-d)}
.help{margin-top:8px;font-size:13.5px;color:var(--mut)}
.help summary{cursor:pointer;font-weight:600;color:var(--jade-d)}
.help ul{margin:6px 0 0;padding-left:18px;display:grid;gap:5px}
@media (max-width:480px){
  .slots{grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .slot{padding:6px}
  .tl svg{width:26px;height:36px}
  .slot-t{min-height:36px}
  .ctx .item{flex:1 1 calc(50% - 6px)}
}
.tiny.x{padding:2px 6px}
@media (max-width:480px){#entry .seg .opt{flex:1 1 auto}}
.room-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:8px}
.room .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:30px;font-weight:700;letter-spacing:.12em;color:var(--jade-d);background:var(--jade-soft);border-radius:12px;padding:6px 14px}
.room .join{display:flex;gap:6px;flex:1 1 220px}
.room .join input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;font-size:16px;text-transform:uppercase;letter-spacing:.1em;background:var(--card);color:var(--ink)}
.room .info{flex:1 1 200px}
body.viewing section.entry,body.viewing #undo,body.viewing #newgame{display:none}
body.viewing .variants,body.viewing .board input,body.viewing .board-foot select,body.viewing .pill.mini{pointer-events:none}
body.viewing .variants .pill:not([aria-pressed="true"]){opacity:.4}
</style>

/* ---------- hand model ---------- */
const nSets = () => S.variant === 'tw' ? 5 : 4;
function handTiles() {
  const H = E.hand, out = [];
  if (H.shape === 'pairs') H.pairs.forEach(p => p && out.push(...p));
  else { H.groups.slice(0, nSets()).forEach(g => g && out.push(...g.tiles)); if (H.pair) out.push(...H.pair); }
  return out;
}
const countOf = c => handTiles().filter(x => x === c).length;
function slotCount() { return E.hand.shape === 'pairs' ? 7 : nSets() + 1; }
function slotFilled(i) {
  const H = E.hand;
  if (H.shape === 'pairs') return !!H.pairs[i];
  return i < nSets() ? !!H.groups[i] : !!H.pair;
}
function nextEmpty(from) {
  const n = slotCount();
  for (let k = 0; k < n; k++) { const i = (from + k) % n; if (!slotFilled(i)) return i; }
  return -1;
}
function handComplete() {
  if (E.hand.shape === 'orphans') return true;
  for (let i = 0; i < slotCount(); i++) if (!slotFilled(i)) return false;
  return true;
}
function waitType() {
  const H = E.hand, w = H.win;
  if (!w) return null;
  if (H.shape === 'pairs' || w.slot === nSets()) return 'single';
  const g = H.groups[w.slot]; if (!g) return null;
  if (g.type !== 'chi') return 'pong';
  const s = rk(g.tiles[0]), r = rk(g.tiles[w.pos]);
  if (r === s + 1) return 'closed';
  if ((s === 1 && r === 3) || (s === 7 && r === 7)) return 'edge';
  return 'two';
}
const WAITNAME = {single:'menunggu tile pasangan', closed:'menunggu tile tengah (mis. 4 untuk 3-5)', edge:'menunggu tile pinggir (3 untuk 1-2, atau 7 untuk 8-9)', two:'menunggu dua kemungkinan (dua sisi)', pong:'menunggu salah satu dari dua pasangan'};

/* ---------- pattern detection ---------- */
function detect() {
  const v = S.variant, H = E.hand, C = Object.assign({}, E.ctx, flowerInfo()), out = [], off = [];
  const add = (l, val) => out.push({l, v: val}), skip = l => off.push(l);
  const self = E.method === 'tsumo';
  const seat = E.winner === null ? null : WCODE[(E.winner - S.dealer + 4) % 4];
  const round = WCODE[S.round];
  let lim = false;
  if (!handComplete()) {
    const left = []; for (let i = 0; i < slotCount(); i++) if (!slotFilled(i)) left.push(i);
    return {incomplete: true, left};
  }
  const tiles = handTiles(), counts = {};
  tiles.forEach(c => counts[c] = (counts[c] || 0) + 1);
  const over = Object.keys(counts).filter(c => counts[c] > 4);
  const suits = new Set(tiles.filter(c => !isHon(c)).map(st)), hasHon = tiles.some(isHon);
  const flush = H.shape === 'orphans' ? null : suits.size === 1 && !hasHon ? 'full' : suits.size === 1 && hasHon ? 'half' : suits.size === 0 ? 'honors' : null;
  const wait = waitType();

  // bonus tiles and situations (shared)
  const bonus = () => {
    if (v === 'hk') {
      if (C.fl === 0) add('Tanpa bunga sama sekali', 1);
      if (C.seatLoose) add('Bunga nomor kursi' + (C.seatLoose > 1 ? ' (' + C.seatLoose + ' tile)' : ''), C.seatLoose);
      if (C.flSet) add('Set bunga lengkap' + (C.flSet > 1 ? ' (2 set)' : ''), 2 * C.flSet);
      if (C.seatFl > C.seatLoose) skip('Bunga nomor kursi (sudah termasuk set)');
      if (C.rob) add('Merebut Kong', 1);
      if (C.rep) add('Menang dari tile pengganti', 1);
      if (C.last) add('Tile terakhir', 1);
      if (C.heaven) { add('Menang di giliran pertama', 'batas'); lim = true; }
      if (self) add('Ambil sendiri', 1);
    }
    if (v === 'tw') {
      if (C.fl === 8) add('Kedelapan bunga', 8);
      else if (C.seatFl) add('Bunga nomor kursi' + (C.seatFl > 1 ? ' (' + C.seatFl + ' tile)' : ''), C.seatFl);
      if (C.last) add('Tile terakhir', 1);
      if (C.rep || C.rob) add('Tile pengganti / merebut Kong', 1);
    }
    if (v === 'sg') {
      if (C.an) add('Tile hewan' + (C.an > 1 ? ' (' + C.an + ' tile)' : ''), C.an);
      if (C.an === 4) add('Keempat hewan', 1);
      if (C.fl === 8) { add('Kedelapan bunga', 'batas'); lim = true; }
      else {
        if (C.seatLoose) add('Bunga nomor kursi' + (C.seatLoose > 1 ? ' (' + C.seatLoose + ' tile)' : ''), C.seatLoose);
        if (C.flSet) add('Set bunga lengkap', 2 * C.flSet);
        if (C.seatFl > C.seatLoose) skip('Bunga nomor kursi (sudah termasuk set)');
      }
      if (C.rep) add('Menang dari tile pengganti', 1);
      if (C.rob || C.last) add('Merebut Kong / tile terakhir', 1);
    }
  };

  if (H.shape === 'orphans') {
    add('13 yatim', 'batas'); lim = true; bonus();
    return {list: out, off, lim, over, wait};
  }
  if (H.shape === 'pairs') {
    add('Tujuh pasang', 4);
    if (flush === 'full') add('Satu jenis saja', 7); else if (flush === 'half') add('Satu jenis + tile huruf', 3);
    else if (flush === 'honors') { add('Semua tile huruf', 'batas'); lim = true; }
    bonus();
    return {list: out, off, lim, over, wait};
  }

  const gs = H.groups.slice(0, nSets()), pair = H.pair[0];
  const chows = gs.filter(g => g.type === 'chi'), pungs = gs.filter(g => g.type !== 'chi');
  const dragonP = pungs.filter(g => isDragon(g.tiles[0])).length;
  const windP = pungs.filter(g => isWind(g.tiles[0])).map(g => g.tiles[0]);
  const concealed = gs.every(g => !g.open);
  const concealedPungs = gs.filter((g, i) => g.type !== 'chi' && !g.open && !(!self && H.win && H.win.slot === i)).length;
  const allChows = chows.length === gs.length, allPungs = pungs.length === gs.length;
  const big3 = dragonP === 3, small3 = dragonP === 2 && isDragon(pair);
  const big4 = windP.length === 4, small4 = windP.length === 3 && isWind(pair);

  if (v === 'hk') {
    if (flush === 'honors') { add('Semua tile huruf', 'batas'); lim = true; }
    if (big4) { add('Empat angin besar', 'batas'); lim = true; }
    if (flush === 'full') add('Satu jenis saja', 7); else if (flush === 'half') add('Satu jenis + tile huruf', 3);
    if (allPungs) add('Semua Pong', 3);
    if (allChows) add('Semua Chi', 1);
    if (big3) add('Tiga Naga besar', 8); else if (small3) add('Tiga Naga kecil', 5); else if (dragonP) add('Pong Naga' + (dragonP > 1 ? ' (' + dragonP + ' set)' : ''), dragonP);
    if (big3 || small3) skip('Pong Naga (sudah termasuk)');
    if (!big4) {
      if (seat && windP.includes(seat)) add('Pong angin kursi (' + WNAME[WCODE.indexOf(seat)] + ')', 1);
      if (windP.includes(round)) add('Pong angin ronde (' + WNAME[S.round] + ')', 1);
    }
    if (concealed) add('Semua tiles tertutup', 1);
    bonus();
  }

  if (v === 'tw') {
    if (concealed && self) add('Tertutup + ambil sendiri', 3);
    else if (concealed) add('Semua tiles tertutup', 1);
    else if (self) add('Ambil sendiri', 1);
    if (flush === 'honors') add('Semua tile huruf', 16);
    if (big4) add('Empat angin besar', 16); else if (small4) add('Empat angin kecil', 8);
    if (flush === 'full') add('Satu jenis saja', 8); else if (flush === 'half') add('Satu jenis + tile huruf', 4);
    if (allPungs) add('Semua Pong', 4);
    const pingHu = allChows && !hasHon && C.fl === 0 && !self && wait === 'two';
    if (pingHu) add('Semua Chi', 2); else if (allChows) skip('Semua Chi (perlu: tanpa huruf & bunga, dari buangan, tunggu dua sisi)');
    if (big3) add('Tiga Naga besar', 8); else if (small3) add('Tiga Naga kecil', 4); else if (dragonP) add('Pong Naga' + (dragonP > 1 ? ' (' + dragonP + ' set)' : ''), dragonP);
    if (!big4 && !small4) {
      if (seat && windP.includes(seat)) add('Pong angin kursi (' + WNAME[WCODE.indexOf(seat)] + ')', 1);
      if (windP.includes(round)) add('Pong angin ronde (' + WNAME[S.round] + ')', 1);
    }
    if (concealedPungs >= 5) add('Lima Pong tertutup', 8); else if (concealedPungs === 4) add('Empat Pong tertutup', 5); else if (concealedPungs === 3) add('Tiga Pong tertutup', 2);
    if (['single','closed','edge'].includes(wait)) add('Tunggu 1 tile saja', 1);
    bonus();
  }

  if (v === 'sg') {
    if (flush === 'honors') { add('Semua tile huruf', 'batas'); lim = true; }
    if (flush === 'full') add('Satu jenis saja', 4); else if (flush === 'half') add('Satu jenis + tile huruf', 2);
    if (allPungs) add('Semua Pong', 2);
    if (big3) { add('Tiga Cendekiawan besar', 'batas'); lim = true; }
    else if (small3) add('Tiga Cendekiawan kecil', 3);
    else if (dragonP) add('Pong Naga' + (dragonP > 1 ? ' (' + dragonP + ' set)' : ''), dragonP);
    if (seat && windP.includes(seat)) add('Pong angin kursi (' + WNAME[WCODE.indexOf(seat)] + ')', 1);
    if (windP.includes(round)) add('Pong angin ronde (' + WNAME[S.round] + ')', 1);
    const pairOk = !isDragon(pair) && pair !== seat && pair !== round;
    if (allChows && pairOk) {
      if (C.fl === 0 && C.an === 0 && (self || wait === 'two')) add('Semua Chi (Ping Hu)', 4);
      else add('Ping Hu kecil (ada bunga/hewan atau tunggu 1 tile)', 1);
    }
    bonus();
  }

}

function hkPoints(f, s) {
  const half = [1,2,4,8,16,24,32,48,64,96,128,192,256,384];
  f = Math.min(f, s.limit);
  return s.table === 'full' ? Math.pow(2, f) : half[Math.min(f, 13)];
}

/* ---------- payments ---------- */
function compute() {
  const v = S.variant, w = E.winner, d = [0,0,0,0];
  const r = {d, value:null, unit:VARIANTS[v].unit, calc:'', warn:'', det:null};
  if (TILE_MODE.includes(v) && E.mode === 'tiles') r.det = detect();
  if (w === null) { r.warn = 'Pilih pemenang dulu.'; return r; }
  if (E.method === 'ron' && (E.from === null || E.from === w)) { r.warn = 'Pilih siapa yang membuang tile kemenangan.'; return r; }
  const others = [0,1,2,3].filter(i => i !== w);
  const pay = (i, x) => { d[i] -= x; d[w] += x; };

  let base = null, lim = false, parts = '';
  if (TILE_MODE.includes(v)) {
    if (E.mode === 'manual') { base = E.manualVal; parts = 'Nilai diisi langsung'; }
    else {
      const det = r.det;
      if (det.incomplete) { r.warn = 'Lengkapi dulu tiles pemenang.'; return r; }
      if (det.over.length) { r.warn = 'Ada tile lebih dari 4 buah: ' + det.over.map(tileName).join(', ') + '.'; return r; }
      base = det.list.reduce((a, x) => a + (typeof x.v === 'number' ? x.v : 0), 0) + E.adj;
      lim = det.lim;
      parts = det.list.map(x => x.l + ' ' + x.v).join(' · ') + (E.adj ? ' · koreksi ' + sgn(E.adj) : '');
    }
  }

  if (v === 'hk') {
    const s = S.set.hk; let f = lim ? s.limit : Math.min(Math.max(base, 0), s.limit);
    const P = hkPoints(f, s);
    r.value = f; r.calc = (parts || 'Tanpa pola') + ' → ' + fmt(P) + ' poin' + (s.table === 'full' ? ' (2 pangkat ' + f + ')' : ' (half spicy)');
    if (E.method === 'tsumo') others.forEach(i => pay(i, P / 2));
    else if (s.shooter === 'all') pay(E.from, P);
    else { pay(E.from, P / 2); others.filter(i => i !== E.from).forEach(i => pay(i, P / 4)); }
  }

  if (v === 'riichi') {
    const dealerWin = w === S.dealer, han = E.han, fu = E.fu;
    let b, tier = '';
    if (E.yakuman) { b = 8000; tier = 'Yakuman'; }
    else if (han >= 11) { b = 6000; tier = 'Sanbaiman'; }
    else if (han >= 8) { b = 4000; tier = 'Baiman'; }
    else if (han >= 6) { b = 3000; tier = 'Haneman'; }
    else if (han >= 5) { b = 2000; tier = 'Mangan'; }
    else { b = Math.min(fu * Math.pow(2, han + 2), 2000); if (b === 2000) tier = 'Mangan'; }
    const hb = S.streak;
    if (E.method === 'ron') {
      pay(E.from, up100(b * (dealerWin ? 6 : 4)) + hb * 300);
      r.calc = (tier || han + ' han ' + fu + ' fu') + ' · Ron ' + (dealerWin ? 'dealer' : 'non-dealer') + (hb ? ' · ' + hb + ' penanda +' + hb * 300 : '');
    } else {
      others.forEach(i => pay(i, (dealerWin || i === S.dealer ? up100(b * 2) : up100(b)) + hb * 100));
      r.calc = (tier || han + ' han ' + fu + ' fu') + ' · Tsumo ' + (dealerWin ? 'dealer: semua bayar sama' : 'non-dealer: dealer bayar 2×') + (hb ? ' · ' + hb + ' penanda +100/orang' : '');
    }
    if (S.pot) { d[w] += S.pot; r.calc += ' · ambil ' + fmt(S.pot) + ' dari tongkat Riichi'; }
    r.value = E.yakuman ? 'Yakuman' : han; r.unit = E.yakuman ? '' : 'han ' + fu + ' fu';
  }

  if (v === 'tw') {
    const s = S.set.tw, t = Math.max(base, 0), db = 1 + 2 * S.streak;
    const cost = i => s.base + (t + ((w === S.dealer || i === S.dealer) ? db : 0)) * s.per;
    if (E.method === 'tsumo') others.forEach(i => pay(i, cost(i))); else pay(E.from, cost(E.from));
    r.value = t; r.calc = (parts || 'Tanpa tai') + ' · dasar ' + s.base + ' + tai × ' + s.per + ' · dealer +' + db + ' tai bila dealer ikut menang/membayar';
  }

  if (v === 'mcr') {
    const tot = E.mcr + E.flowers;
    if (E.method === 'tsumo') others.forEach(i => pay(i, 8 + tot));
    else { pay(E.from, 8 + tot); others.filter(i => i !== E.from).forEach(i => pay(i, 8)); }
    r.value = tot; r.calc = E.mcr + ' poin pola' + (E.flowers ? ' + ' + E.flowers + ' bunga' : '') + (E.method === 'tsumo' ? ' · tiap pemain bayar 8 + ' + tot : ' · pembuang 8 + ' + tot + ', lain 8');
    if (E.mcr < 8) r.warn = 'MCR minimal 8 poin (tanpa bunga). Belum boleh menang.';
  }

  if (v === 'sg') {
    const s = S.set.sg; let t = lim ? s.limit : Math.min(Math.max(base, 0), s.limit);
    const one = s.unit * Math.pow(2, Math.max(t, 1) - 1);
    if (E.method === 'tsumo') others.forEach(i => pay(i, 2 * one));
    else if (s.shooterAll) pay(E.from, 4 * one);
    else { pay(E.from, 2 * one); others.filter(i => i !== E.from).forEach(i => pay(i, one)); }
    r.value = t; r.calc = (parts || 'Tanpa tai') + ' · 1 bagian = ' + fmt(one) + ' unit';
  }

  if (TILE_MODE.includes(v) && typeof r.value === 'number') {
    const min = S.set.minWin[v] || 0, got = v === 'hk' ? (lim ? 99 : base) : v === 'sg' && lim ? 99 : Math.max(base, 0);
    if (min && got < min) { r.blocked = true; r.warn = (v === 'sg' && min === 1 ? 'Singapura' : 'Mode kompetitif') + ': minimal ' + min + ' ' + VARIANTS[v].unit + ' untuk menang. Ini baru ' + Math.max(base, 0) + ' ' + VARIANTS[v].unit + '.'; }
  }

  if (v === 'am') {
    const V = E.value * (E.jokerless ? 2 : 1);
    if (E.method === 'tsumo') others.forEach(i => pay(i, 2 * V));
    else { pay(E.from, 2 * V); others.filter(i => i !== E.from).forEach(i => pay(i, V)); }
    r.value = V; r.calc = 'Nilai kartu ' + E.value + (E.jokerless ? ' × 2 (tanpa joker)' : '') + (E.method === 'tsumo' ? ' · semua bayar 2×' : ' · pembuang 2×, lain 1×');
  }
  return r;
}

/* ---------- dealer rotation ---------- */
function afterWin(w) {
  const stays = ['hk','riichi','tw','sg'].includes(S.variant) && w === S.dealer;
  if (stays) S.streak++; else rotate();
}
function rotate() { S.dealer = (S.dealer + 1) % 4; S.streak = 0; if (S.dealer === 0) S.round = (S.round + 1) % 4; }
function afterDraw() { if (['hk','riichi','tw'].includes(S.variant)) S.streak++; else rotate(); }

/* ---------- render ---------- */

  $('variants').innerHTML = Object.entries(VARIANTS).map(([k, o]) =>

}

  const parts = [];
  parts.push(`<label>Dealer: <select id="dealersel">${[0,1,2,3].map(i => `<option value="${i}"${i === S.dealer ? ' selected' : ''}>${name(i)}</option>`).join('')}</select></label>`);
  parts.push(`<label>Angin ronde: <select id="roundsel">${[0,1,2,3].map(i => `<option value="${i}"${i === S.round ? ' selected' : ''}>${WINDS[i]} ${WNAME[i]}</option>`).join('')}</select></label>`);
  if (TILE_MODE.includes(S.variant)) {

    parts.push(`<label>Mode: <select id="minsel">${[0,1,2,3,4,5].filter(x => x >= lo).map(x => `<option value="${x}"${x === m ? ' selected' : ''}>${x === lo ? 'Santai' + (lo ? ' (min. 1 ' + u + ')' : ' (tanpa minimum)') : 'Kompetitif: min. ' + x + ' ' + u}</option>`).join('')}</select></label>`);
  }

  if (S.variant === 'riichi') parts.push(`<span>Tongkat Riichi di meja: <b class="num">${fmt(S.pot)}</b></span>`);
  $('boardfoot').innerHTML = parts.join('');
}

function stepper(id, val, label) {
  return `<span class="stepper"><button data-step="${id}" data-d="-1" aria-label="Kurangi ${label}">−</button><input id="${id}" type="number" inputmode="numeric" value="${val}" aria-label="${label}"><button data-step="${id}" data-d="1" aria-label="Tambah ${label}">+</button></span>`;
}
function counter(key, label, max) {
  const n = E.ctx[key];
  return `<span class="counter${n ? ' on' : ''}"><span>${label}</span><button data-cdec="${key}" aria-label="Kurangi ${label}">−</button><output>${n}</output><button data-cinc="${key}" data-max="${max}" aria-label="Tambah ${label}">+</button></span>`;
}
const toggle = (key, label) => `<button class="item" data-ctog="${key}" aria-pressed="${!!E.ctx[key]}">${label}</button>`;

function chooserHTML() {
  const c = E.hand.pick; if (!c) return '';
  const opts = [];
  const room = k => countOf(c) + k <= 4;
  if (room(3)) opts.push({type:'pong', tiles:[c,c,c], l:'Pong <small>3 sama</small>'});
  if (room(4)) opts.push({type:'kong', tiles:[c,c,c,c], l:'Kong <small>4 sama</small>'});
  if (!isHon(c)) {
    const r = rk(c), s = st(c);
    for (let a = r - 2; a <= r; a++) if (a >= 1 && a <= 7) {
      const t = [a, a + 1, a + 2].map(x => x + s);
      if (t.every(x => countOf(x) + 1 <= 4)) opts.push({type:'chi', tiles:t, l:'Chi <small>urut</small>'});
    }
  }
  E.hand.opts = opts;
  return `<div class="chooser"><span class="status">${tileName(c)} masuk ke set yang mana?</span>${opts.map((o, i) =>
    `<button data-opt="${i}">${o.tiles.map(x => tl(x)).join('')} ${o.l}</button>`).join('') || '<span class="info">Tile ini sudah habis (maks. 4).</span>'}
    <button data-cancelpick="1">Batal</button></div>`;
}

function slotsHTML() {
  const H = E.hand, n = nSets();
  const win = H.win;
  const tilesOf = (arr, slot) => arr.map((c, pos) => tl(c, `data-wt="${slot}:${pos}"`, win && win.slot === slot && win.pos === pos ? 'win' : '')).join('');
  let h = '<div class="slots">';
  if (H.shape === 'pairs') {
    for (let i = 0; i < 7; i++) {
      const p = H.pairs[i];
      h += `<div class="slot${H.active === i ? ' active' : ''}${p ? ' filled' : ''}" data-slot="${i}"><div class="slot-h">Pasangan ${i + 1}${p ? `<button class="tiny x" data-clear="${i}" aria-label="Hapus">✕</button>` : ''}</div>
        <div class="slot-t">${p ? tilesOf(p, i) : '<em>Kosong</em>'}</div></div>`;
    }
  } else {
    for (let i = 0; i < n; i++) {
      const g = H.groups[i];
      h += `<div class="slot${H.active === i ? ' active' : ''}${g ? ' filled' : ''}" data-slot="${i}"><div class="slot-h"><span class="nw">Set ${i + 1}${g ? ` · ${g.type === 'chi' ? 'Chi' : g.type === 'pong' ? 'Pong' : 'Kong'}` : ''}</span>
        ${g ? `<span style="display:flex;gap:4px"><button class="tiny" data-open="${i}" aria-pressed="${g.open}">${g.open ? 'Dibuka' : 'Tertutup'}</button><button class="tiny x" data-clear="${i}" aria-label="Hapus set">✕</button></span>` : ''}</div>
        <div class="slot-t">${g ? tilesOf(g.tiles, i) : '<em>Kosong</em>'}</div></div>`;
    }
    h += `<div class="slot${H.active === n ? ' active' : ''}${H.pair ? ' filled' : ''}" data-slot="${n}"><div class="slot-h">Pasangan (mata)${H.pair ? `<button class="tiny x" data-clear="${n}" aria-label="Hapus">✕</button>` : ''}</div>
      <div class="slot-t">${H.pair ? tilesOf(H.pair, n) : '<em>Kosong</em>'}</div></div>`;
  }
  return h + '</div>';
}

function paletteHTML() {
  const rows = [['m','Karakter'],['p','Bulat'],['s','Bambu']].map(([s]) => [1,2,3,4,5,6,7,8,9].map(i => i + s));

  return '<div class="pal">' + rows.map(r => '<div class="pal-row">' + r.map(c =>
    `<button data-tile="${c}" aria-label="${tileName(c)}"${countOf(c) >= 4 ? ' disabled' : ''}>${TILES[c]}</button>`).join('') + '</div>').join('') + '</div>';
}

function tileEntryHTML(r) {
  const v = S.variant, H = E.hand;
  let h = `<div class="row"><p class="label">Cara menghitung</p><div class="seg">
    <button class="opt" data-mode="tiles" aria-pressed="${E.mode === 'tiles'}">Pilih tiles, dihitung otomatis</button>
    <button class="opt" data-mode="manual" aria-pressed="${E.mode === 'manual'}">Ketik ${VARIANTS[v].unit} sendiri</button></div></div>`;
  if (E.mode === 'manual') return h + `<div class="row"><p class="label">Jumlah ${VARIANTS[v].unit} (termasuk bunga)</p>${stepper('manualVal', E.manualVal, VARIANTS[v].unit)}</div>`;

  const shapes = v === 'hk' ? [['std','Biasa: 4 set + pasangan'],['pairs','7 pasang'],['orphans','13 yatim']]
    : v === 'sg' ? [['std','Biasa: 4 set + pasangan'],['orphans','13 yatim']] : [['std','5 set + pasangan']];
  h += `<p class="label">Tiles pemenang</p>`;
  if (shapes.length > 1) h += `<div class="seg">${shapes.map(([k, l]) => `<button class="opt" data-shape="${k}" aria-pressed="${H.shape === k}">${l}</button>`).join('')}</div>`;

  if (H.shape !== 'orphans') {
    const det = r.det, done = handComplete();
    const status = !done ? (H.shape === 'pairs' ? 'Pasangan ' + (H.active + 1) + ': ketuk tilenya di bawah.'
        : H.active === nSets() ? 'Pasangan: ketuk tilenya di bawah (2 tile sama).' : 'Set ' + (H.active + 1) + ': ketuk salah satu tilenya di bawah, lalu pilih jenis set.')
      : !H.win ? '✔ Tiles lengkap. Sekarang ketuk tile TERAKHIR yang membuat menang (di kotak atas).'
      : 'Tile terakhir: ' + tileName(handTilesAt(H.win)) + ' · ' + WAITNAME[waitType()];
    const tip = !done && H.shape === 'std' && H.active < nSets() ? '<p class="info">Set yang diambil dari buangan orang lain: tekan "Tertutup" pada set itu sampai berubah jadi "Dibuka".</p>' : '';
    h += slotsHTML() + `<p class="status">${status}</p>` + tip + chooserHTML() + (done ? '' : paletteHTML());
  }

  // flowers are picked as tiles; the counts follow from what is picked
  const fi = flowerInfo(), fw = E.ctx.fw;
  const btile = c => `<button class="bt" data-fw="${c}" aria-pressed="${fw.includes(c)}" aria-label="${BONUSNAME[c]}">${TILES[c]}<span>${BONUSNAME[c]}</span></button>`;
  const seatTxt = fi.seatI === null ? 'pilih pemenang dulu' : WINDS[fi.seatI] + ' ' + WNAME[fi.seatI] + ' = nomor ' + (fi.seatI + 1);
  const sum = [fi.fl ? fi.fl + ' bunga' : 'belum ada bunga', fi.seatFl ? fi.seatFl + ' cocok nomor kursi' : '', fi.flSet ? fi.flSet + ' set lengkap' : '', v === 'sg' && fi.an ? fi.an + ' hewan' : ''].filter(Boolean).join(' · ');
  h += `<div class="row"><p class="label">Bunga yang dibuka pemenang</p>
    <p class="info">Ketuk bunga yang dimiliki pemenang. Kursi pemenang: <b>${seatTxt}</b>.</p>
    <div class="bgrp"><span>Bunga</span><div class="bpal">${FLW.slice(0,4).map(btile).join('')}</div></div>
    <div class="bgrp"><span>Musim</span><div class="bpal">${FLW.slice(4).map(btile).join('')}</div></div>
    ${v === 'sg' ? `<div class="bgrp"><span>Hewan</span><div class="bpal">${ANM.map(btile).join('')}</div></div>` : ''}
    <p class="status">${sum}</p></div>
    <div class="row"><p class="label">Cara menangnya (ketuk kalau terjadi)</p>
    <div class="ctx">${toggle('rep', 'Menang dari tile pengganti')}${toggle('rob', 'Merebut Kong lawan')}${toggle('last', 'Tile terakhir tembok')}${v === 'hk' ? toggle('heaven', 'Menang di giliran pertama') : ''}</div>
    <details class="help"><summary>Apa artinya?</summary><ul>
      <li><b>Tile pengganti</b>: setelah membuat Kong atau membuka bunga, kamu ambil 1 tile dari belakang tembok, dan tile itu yang membuat menang.</li>
      <li><b>Merebut Kong lawan</b>: lawan menambah tile ke-4 ke Pong yang sudah dibuka, dan tile itu yang kamu tunggu. Lawan itu yang membayar (pilih dia di "Siapa yang membuang").</li>
      <li><b>Tile terakhir tembok</b>: menang dengan tile paling akhir sebelum tembok habis.</li>
      ${v === 'hk' ? '<li><b>Giliran pertama</b>: dealer menang langsung dari 14 tile awal, atau pemain lain menang dari buangan pertama dealer.</li>' : ''}
      <li><b>Set bunga lengkap</b>: keempat Bunga (Plum, Anggrek, Krisan, Bambu) atau keempat Musim (Semi, Panas, Gugur, Dingin).</li>
    </ul></details></div>`;

  const det = r.det;
  if (det && !det.incomplete) {
    h += `<div class="row"><p class="label">Nilai yang didapat (otomatis)</p><div class="found">${det.list.length ? det.list.map(x => `<span>${x.l}<b>${x.v}</b></span>`).join('') : '<span class="off">Belum ada nilai</span>'}
      ${det.off.map(x => `<span class="off">${x}</span>`).join('')}</div></div>
      <div class="row"><p class="label">Tambah / kurangi manual</p><p class="info">Hanya kalau ada pola aturan meja yang belum dihitung di atas.</p>${stepper('adj', E.adj, 'koreksi')}</div>`;
  }
  return h;
}
function handTilesAt(w) { const H = E.hand; if (H.shape === 'pairs') return H.pairs[w.slot][w.pos]; return w.slot === nSets() ? H.pair[w.pos] : H.groups[w.slot].tiles[w.pos]; }

      <div class="row"><p class="label">Bonus</p><div class="items"><button class="item" data-jokerless="1" aria-pressed="${E.jokerless}">Tanpa joker <b>×2</b></button></div></div></div>`;

      <div class="pays">${[0,1,2,3].map(i => `<div class="pay"><span>${name(i)}</span><b class="num ${r.d[i] > 0 ? 'pos' : r.d[i] < 0 ? 'neg' : ''}">${r.d[i] ? sgn(r.d[i]) : '0'}</b></div>`).join('')}</div></div>`;

  h += settingsHTML();

function settingsHTML() {
  const v = S.variant, s = S.set;
  let b = '';
  if (v === 'hk') b = `<label>Tabel poin <select id="hk-table"><option value="full"${s.hk.table === 'full' ? ' selected' : ''}>2 pangkat faan (full spicy)</option><option value="half"${s.hk.table === 'half' ? ' selected' : ''}>Half spicy</option></select></label>
      <label>Batas faan <select id="hk-limit">${[8,10,13].map(x => `<option${s.hk.limit === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label>Menang dari buangan <select id="hk-shooter"><option value="all"${s.hk.shooter === 'all' ? ' selected' : ''}>Pembuang bayar penuh</option><option value="half"${s.hk.shooter === 'half' ? ' selected' : ''}>Pembuang ½, dua lain ¼</option></select></label>`;
  if (v === 'riichi') b = `<label>Poin awal <input id="ri-start" type="number" step="1000" value="${s.riichi.start}"></label><span>Seri: pemain yang belum tenpai membayar 3.000 total; catat manual bila perlu.</span>`;
  if (v === 'tw') b = `<label>Nilai dasar <input id="tw-base" type="number" value="${s.tw.base}"></label><label>Nilai per tai <input id="tw-per" type="number" value="${s.tw.per}"></label>`;
  if (v === 'sg') b = `<label>Nilai 1 unit <input id="sg-unit" type="number" value="${s.sg.unit}"></label>
      <label>Batas tai <select id="sg-limit">${[3,4,5,6,8,10].map(x => `<option${s.sg.limit === x ? ' selected' : ''}>${x}</option>`).join('')}</select></label>
      <label><input id="sg-shooter" type="checkbox"${s.sg.shooterAll ? ' checked' : ''}> Pembuang menanggung semua</label>`;
  if (v === 'mcr') b = '<span>Aturan resmi MCR 2006: pembuang bayar 8 + skor, dua pemain lain 8. Ambil sendiri: tiap pemain bayar 8 + skor. Dealer selalu pindah.</span>';
  if (v === 'am') b = '<span>Aturan NMJL: dari buangan, pembuang bayar 2× nilai kartu dan dua lain 1×. Ambil sendiri: semua bayar 2×. Tanpa joker: nilai ×2.</span>';
  return `<details><summary>Aturan meja ${VARIANTS[v].name}</summary><div class="settings">${b}</div></details>`;
}

function renderHist() {
  const list = S.hist.slice().reverse();
  let n = S.hist.filter(h => h.type !== 'riichi').length;
  $('hist').innerHTML = list.length ? list.map(h => {
    const label = h.type === 'riichi' ? '·' : n--;
    return `<div class="h"><span class="n">${label}</span><div><p>${h.text}</p>
      ${h.tiles ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin:4px 0">${h.tiles.map(g => `<span style="display:inline-flex;gap:1px">${g.map(c => `<span class="tl" style="line-height:0">${TILES[c].replace('<svg ', '<svg style="width:20px;height:27px" ')}</span>`).join('')}</span>`).join('')}</div>` : ''}
      <div class="d num">${h.d.map((x, i) => x ? `<span>${name(i)} <b class="${x > 0 ? 'pos' : 'neg'}">${sgn(x)}</b></span>` : '').join('')}</div></div></div>`;
  }).join('') : '<p class="empty">Belum ada kemenangan. Pilih pemenang di atas, isi tiles-nya, lalu tekan "Catat kemenangan".</p>';
  $('confirmbox').innerHTML = confirming === 'new'
    ? `<div class="confirm">Hapus semua skor dan mulai dari nol? <button class="primary" style="padding:7px 14px;font-size:14px" id="yes">Ya, mulai baru</button><button class="ghost" style="padding:6px 12px" id="no">Batal</button></div>`
    : confirming && confirming.v ? `<div class="confirm">Ganti ke ${VARIANTS[confirming.v].name} akan memulai permainan baru. <button class="primary" style="padding:7px 14px;font-size:14px" id="yes">Ganti varian</button><button class="ghost" style="padding:6px 12px" id="no">Batal</button></div>` : '';
}
function renderAll() { renderRoom(); renderVariants(); renderBoard(); renderEntry(); renderHist(); }

/* ---------- events ---------- */
document.addEventListener('click', ev => {
  if (viewing()) return;
  const H = E.hand;
  const wt = ev.target.closest('[data-wt]');
  if (wt && wt.closest('#entry') && !wt.closest('.chooser')) {
    const [slot, pos] = wt.dataset.wt.split(':').map(Number);
    if (handComplete()) { H.win = {slot, pos}; renderEntry(); return; }
  }
  const b = ev.target.closest('button');
  if (!b) {
    const sl = ev.target.closest('[data-slot]');
    if (sl) { H.active = +sl.dataset.slot; H.pick = null; renderEntry(); }
    return;
  }
  const ds = b.dataset;
  if (ds.variant) {
    if (ds.variant === S.variant) return;
    if (S.hist.length) { confirming = {v: ds.variant}; renderHist(); return; }
    S.variant = ds.variant; S.dealer = 0; S.streak = 0; S.pot = 0; S.round = 0; E = freshEntry(); save(); renderAll(); return;
  }
  if (b.id === 'yes') {
    const keep = S.names, set = S.set, v = confirming && confirming.v ? confirming.v : S.variant;
    S = defaults(); S.names = keep; S.set = set; S.variant = v; E = freshEntry(); confirming = null; save(); renderAll(); return;
  }
  if (b.id === 'no') { confirming = null; renderHist(); return; }
  if (b.id === 'newgame') { confirming = 'new'; renderHist(); return; }
  if (b.id === 'undo') {
    const h = S.hist.pop(); if (!h) return;
    S.dealer = h.prev.dealer; S.streak = h.prev.streak; S.pot = h.prev.pot; if (h.prev.round !== undefined) S.round = h.prev.round; save(); renderAll(); return;
  }
  if (ds.riichi !== undefined) {
    const i = +ds.riichi, d = [0,0,0,0]; d[i] = -1000;
    S.hist.push({type:'riichi', d, text: name(i) + ' menyatakan Riichi dan menyetor 1.000.', prev:{dealer:S.dealer, streak:S.streak, pot:S.pot, round:S.round}});
    S.pot += 1000; save(); renderBoard(); renderEntry(); renderHist(); return;
  }
  if (ds.winner !== undefined) { E.winner = +ds.winner; if (E.from === E.winner) E.from = null; }
  else if (ds.method) E.method = ds.method;
  else if (ds.from !== undefined) E.from = +ds.from;
  else if (ds.mode) E.mode = ds.mode;
  else if (ds.shape) { E.hand = freshHand(); E.hand.shape = ds.shape; }
  else if (ds.tile) {
    const c = ds.tile;
    if (H.shape === 'pairs') { if (countOf(c) + 2 <= 4) { H.pairs[H.active] = [c, c]; H.win = null; H.active = nextEmpty(H.active); } }
    else if (H.active === nSets()) { if (countOf(c) + 2 <= 4) { H.pair = [c, c]; H.win = null; H.active = nextEmpty(H.active); } }
    else H.pick = c;
  }
  else if (ds.opt !== undefined) {
    const o = H.opts[+ds.opt]; H.groups[H.active] = {type:o.type, tiles:o.tiles, open:false}; H.pick = null; H.win = null; H.active = nextEmpty(H.active);
  }
  else if (ds.cancelpick) H.pick = null;
  else if (ds.open !== undefined) { const g = H.groups[+ds.open]; g.open = !g.open; }
  else if (ds.clear !== undefined) {
    const i = +ds.clear;
    if (H.shape === 'pairs') H.pairs[i] = null; else if (i === nSets()) H.pair = null; else H.groups[i] = null;
    H.active = i; H.win = null; H.pick = null;
  }
  else if (ds.fw) { const f = E.ctx.fw, i = f.indexOf(ds.fw); if (i >= 0) f.splice(i, 1); else f.push(ds.fw); }
  else if (ds.ctog) E.ctx[ds.ctog] = E.ctx[ds.ctog] ? 0 : 1;
  else if (ds.fu) E.fu = +ds.fu;
  else if (ds.yakuman) E.yakuman = !E.yakuman;
  else if (ds.jokerless) E.jokerless = !E.jokerless;
  else if (ds.val) E.value = +ds.val;
  else if (ds.step) { const k = ds.step, min = k === 'han' ? 1 : k === 'adj' ? -20 : 0; E[k] = Math.max(min, (E[k] || 0) + (+ds.d)); }
  else if (b.id === 'clear') E = freshEntry();
  else if (b.id === 'record') {
    const r = compute(); if (E.winner === null || r.value === null || r.blocked) return;
    const how = E.method === 'tsumo' ? 'dengan ambil sendiri' : 'dari buangan ' + name(E.from);
    const val = typeof r.value === 'number' ? fmt(r.value) + ' ' + r.unit : r.value + (r.unit ? ' ' + r.unit : '');
    let tiles = null;
    if (TILE_MODE.includes(S.variant) && E.mode === 'tiles' && E.hand.shape !== 'orphans') {
      tiles = E.hand.shape === 'pairs' ? E.hand.pairs.slice() : E.hand.groups.slice(0, nSets()).map(g => g.tiles).concat([E.hand.pair]);
    }
    const pats = r.det && r.det.list ? ' · ' + r.det.list.map(x => x.l).join(', ') : '';
    S.hist.push({type:'win', d:r.d, tiles, text:`<b>${name(E.winner)}</b> menang ${how} · ${val}${pats}`, prev:{dealer:S.dealer, streak:S.streak, pot:S.pot, round:S.round}});
    if (S.variant === 'riichi') S.pot = 0;
    afterWin(E.winner); E = freshEntry(); save(); renderAll(); return;
  }
  else if (b.id === 'draw') {
    S.hist.push({type:'draw', d:[0,0,0,0], text:'Seri: tembok habis tanpa pemenang.', prev:{dealer:S.dealer, streak:S.streak, pot:S.pot, round:S.round}});
    afterDraw(); E = freshEntry(); save(); renderAll(); return;
  }
  else return;
  renderEntry();
});
document.addEventListener('input', ev => {
  const t = ev.target;
  if (viewing()) return;
  if (t.dataset.name !== undefined) { S.names[+t.dataset.name] = t.value; save(); renderEntry(); renderHist(); return; }
  if (['han','mcr','flowers','value','manualVal','adj'].includes(t.id)) {
    const n = parseInt(t.value, 10);
    if (!isNaN(n)) { E[t.id] = Math.max(t.id === 'han' ? 1 : t.id === 'adj' ? -20 : 0, n); const id = t.id; renderEntry(); const el = $(id); if (el) el.focus(); }
  }
});
document.addEventListener('change', ev => {
  const t = ev.target, s = S.set;
  if (viewing()) return;
  if (t.id === 'dealersel') { S.dealer = +t.value; S.streak = 0; save(); renderBoard(); renderEntry(); return; }
  if (t.id === 'roundsel') { S.round = +t.value; save(); renderBoard(); renderEntry(); return; }
  if (t.id === 'minsel') { S.set.minWin[S.variant] = +t.value; save(); renderBoard(); renderEntry(); return; }
  if (t.id === 'hk-table') s.hk.table = t.value;
  else if (t.id === 'hk-limit') s.hk.limit = +t.value;
  else if (t.id === 'hk-shooter') s.hk.shooter = t.value;
  else if (t.id === 'ri-start') { s.riichi.start = +t.value || 0; save(); renderBoard(); return; }
  else if (t.id === 'tw-base') s.tw.base = +t.value || 0;
  else if (t.id === 'tw-per') s.tw.per = +t.value || 0;
  else if (t.id === 'sg-unit') s.sg.unit = +t.value || 1;
  else if (t.id === 'sg-limit') s.sg.limit = +t.value;
  else if (t.id === 'sg-shooter') s.sg.shooterAll = t.checked;
  else return;
  save(); renderEntry();
});

/* ---------- shared room ---------- */
const ROOM_SERVER = (window.JADE_ROOM_SERVER || (location.protocol.startsWith('http') && window.JADE_ROOM_SAME_ORIGIN ? location.origin : '')).replace(/\/$/, '');
const saveRoom = () => { try { ROOM ? localStorage.setItem('jade-room', JSON.stringify(ROOM)) : localStorage.removeItem('jade-room'); } catch (e) {} };
const api = (path, opt = {}) => fetch(ROOM_SERVER + '/api/rooms' + path, Object.assign({headers: {'Content-Type': 'application/json'}}, opt))
  .then(async r => { const j = await r.json().catch(() => ({})); if (!r.ok) throw Object.assign(new Error(j.error || 'Server error'), {status: r.status}); return j; });
const viewing = () => ROOM && ROOM.role === 'view';

function pushRoom() {
  clearTimeout(pushTimer);
  pushTimer = setTimeout(() => {
    api('/' + ROOM.code, {method: 'PUT', headers: {'Content-Type': 'application/json', 'X-Host-Key': ROOM.key}, body: JSON.stringify({state: S})})
      .then(j => { roomViewers = j.viewers; roomStatus = 'ok'; renderRoom(); })
      .catch(e => { roomStatus = e.status === 404 || e.status === 403 ? 'gone' : 'offline'; renderRoom(); });
  }, 250);
}

async function createRoom() {
  if (!ROOM_SERVER) return;
  roomStatus = 'busy'; renderRoom();
  try {
    const j = await api('', {method: 'POST', body: JSON.stringify({state: S})});
    ROOM = {code: j.code, key: j.key, role: 'host'}; roomStatus = 'ok'; saveRoom();
  } catch (e) { roomStatus = 'offline'; }
  renderAll();
}

function joinRoom(code) {
  code = (code || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (code.length < 4 || !ROOM_SERVER) return;
  ROOM = {code, role: 'view'}; saveRoom(); roomStatus = 'busy';
  listen(); renderAll();
}

let wsRetry = 0, wsTimer = null, wsPing = null;
function stopListen() {
  clearTimeout(wsTimer); clearInterval(wsPing);
  if (es) { const s = es; es = null; try { s.close(); } catch (e) {} }
}
function listen() {
  stopListen();
  if (!viewing()) return;
  const sock = es = new WebSocket(ROOM_SERVER.replace(/^http/, 'ws') + '/api/rooms/' + ROOM.code + '/ws');
  sock.onopen = () => { wsRetry = 0; wsPing = setInterval(() => { if (sock.readyState === 1) sock.send('ping'); }, 25e3); };
  sock.onmessage = ev => {
    if (ev.data === 'pong') return;
    let j; try { j = JSON.parse(ev.data); } catch (e) { return; }
    if (j.type === 'closed') { roomStatus = 'gone'; stopListen(); renderRoom(); return; }
    if (j.type !== 'state') return;
    if (j.state && j.state.names) { S = j.state; S.set = Object.assign(defaults().set, S.set || {}); S.set.minWin = Object.assign({hk:0,tw:0,sg:1}, S.set.minWin || {}); }
    roomUpdated = j.updated; roomStatus = 'ok'; E = freshEntry(); renderAll();
  };
  sock.onclose = () => {
    if (sock !== es) return; // sudah diganti atau ditutup sengaja
    es = null; clearInterval(wsPing);
    if (!viewing() || roomStatus === 'gone') return;
    // cek kenapa terputus: room sudah tidak ada, atau koneksi saja
    fetch(ROOM_SERVER + '/api/rooms/' + ROOM.code).then(r => {
      if (r.status === 404) { roomStatus = 'gone'; renderRoom(); return; }
      retry();
    }).catch(retry);
  };
  function retry() {
    roomStatus = 'retry'; renderRoom();
    wsTimer = setTimeout(listen, Math.min(30e3, 1500 * 2 ** wsRetry++));
  }
}
// HP baru dibuka lagi: sambung ulang tanpa menunggu
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && viewing() && ROOM_SERVER && roomStatus !== 'gone' && (!es || es.readyState > 1)) { wsRetry = 0; listen(); }
});

function leaveRoom() {
  const was = ROOM; ROOM = null; saveRoom(); stopListen();
  if (was && was.role === 'host') api('/' + was.code, {method: 'DELETE', headers: {'X-Host-Key': was.key}}).catch(() => {});
  if (was && was.role === 'view') {
    try { S = JSON.parse(localStorage.getItem('jade-score') || 'null'); } catch (e) { S = null; }
    if (!S || !S.names) S = defaults();
    S.set = Object.assign(defaults().set, S.set || {}); S.set.minWin = Object.assign({hk:0,tw:0,sg:1}, S.set.minWin || {});
  }
  roomStatus = ''; E = freshEntry(); renderAll();
}

function shareLink() {
  const u = new URL(location.href); u.search = '?room=' + ROOM.code; u.hash = '';
  return u.toString();
}

function renderRoom() {
  const el = $('room'); if (!el) return;
  const msg = {busy: 'Menyambungkan…', offline: 'Server room tidak bisa dihubungi. Skor tetap tersimpan di HP ini.', retry: 'Koneksi terputus, mencoba lagi…',
    gone: 'Room tidak ditemukan atau sudah ditutup. Cek lagi kodenya.'}[roomStatus] || '';
  let h;
  if (!ROOM_SERVER) {
    h = `<p class="label">Room bersama</p><p class="info">Belum aktif. Server room belum diatur di halaman ini.</p>`;
  } else if (!ROOM) {
    h = `<p class="label">Room bersama</p>
      <p class="info">Buat room supaya pemain lain bisa melihat skor meja ini langsung dari HP masing-masing.</p>
      <div class="room-row"><button class="primary" id="mkroom">Buat room</button>
      <span class="join"><input id="roomcode" maxlength="8" placeholder="Kode room" autocomplete="off" autocapitalize="characters" aria-label="Kode room"><button class="ghost" id="joinroom">Masuk</button></span></div>
      ${msg ? `<p class="warn">${msg}</p>` : ''}`;
  } else if (ROOM.role === 'host') {
    h = `<p class="label">Room bersama · kamu pembuatnya</p>
      <div class="room-row"><div class="code" aria-label="Kode room">${ROOM.code}</div>
      <div class="info">Pemain lain buka halaman ini, ketuk <b>Masuk</b>, lalu ketik kode ini.<br>${roomStatus === 'ok' ? `<b>${roomViewers}</b> orang sedang melihat.` : ''}</div></div>
      <div class="room-row"><button class="ghost" id="shareroom">Bagikan link</button><button class="ghost" id="leaveroom">Tutup room</button></div>
      ${msg ? `<p class="warn">${msg}</p>` : ''}`;
  } else {
    const t = roomUpdated ? new Date(roomUpdated).toLocaleTimeString('id-ID', {hour: '2-digit', minute: '2-digit'}) : '';
    h = `<p class="label">Melihat room</p>
      <div class="room-row"><div class="code">${ROOM.code}</div>
      <div class="info">Skor dicatat oleh pembuat room dan muncul di sini otomatis.${t ? '<br>Terakhir diperbarui ' + t + '.' : ''}</div></div>
      <div class="room-row"><button class="ghost" id="leaveroom">Keluar dari room</button></div>
      ${msg ? `<p class="warn">${msg}</p>` : ''}`;
  }
  el.innerHTML = h;
  document.body.classList.toggle('viewing', !!viewing());
}

document.addEventListener('click', ev => {
  const b = ev.target.closest('button'); if (!b) return;
  if (b.id === 'mkroom') createRoom();
  else if (b.id === 'joinroom') joinRoom($('roomcode').value);
  else if (b.id === 'leaveroom') leaveRoom();
  else if (b.id === 'shareroom') {
    const link = shareLink(), text = 'Lihat skor meja Jade Mahjong. Kode room: ' + ROOM.code;
    if (navigator.share) navigator.share({title: 'Jade Mahjong', text, url: link}).catch(() => {});
    else if (navigator.clipboard) navigator.clipboard.writeText(link).then(() => { b.textContent = 'Link disalin ✓'; setTimeout(() => renderRoom(), 1800); });
  }
});
document.addEventListener('keydown', ev => { if (ev.key === 'Enter' && ev.target.id === 'roomcode') joinRoom(ev.target.value); });

{
  const q = new URLSearchParams(location.search).get('room');
  if (q && ROOM_SERVER && !(ROOM && ROOM.code === q.toUpperCase())) joinRoom(q);
  else if (ROOM && ROOM.role === 'view' && ROOM_SERVER) { roomStatus = 'busy'; listen(); }
  else if (ROOM && ROOM.role === 'host') pushRoom();
}

renderAll();
window.__jadeTest = { compute, detect, setE: x => { E = Object.assign(freshEntry(), x); }, S: () => S, E: () => E };
})();
</script>
</body></html>
