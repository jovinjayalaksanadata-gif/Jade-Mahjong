<style>




:root{--em:#145a43;--emd:#0d3f2f;--iv:#fbf7ec;--gold:#b08d3c;--ink:#22241f;--mut:#6d6a5e;--red:#a62f20;--line:#e3d9bf}
*{box-sizing:border-box} 
.pg{width:874px;height:1240px;background:var(--iv);position:relative;overflow:hidden;padding:64px 64px 0;font-family:'IBM Plex Sans',sans-serif;color:var(--ink);margin:0}

.lab-row{display:flex;flex-wrap:wrap;gap:16px}

.card{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:20px 22px}

.cover{background:var(--em);color:var(--iv);padding:0}

.cover h1{color:var(--iv);font-size:96px;margin:22px auto 0;text-align:center;max-width:none}

.cover .sub{font-size:24px;color:#d9e7df}
.cover .foot{color:#d8bd78;border-color:transparent;text-align:center;bottom:70px}
.dg{width:100%;height:auto}
.steps{display:grid;grid-template-columns:1fr;gap:18px}

.num{width:80px;height:80px;border-radius:50%;background:var(--em);color:var(--iv);font-family:'Cormorant Garamond';font-weight:700;font-size:38px;display:flex;align-items:center;justify-content:center}
.step b{font-family:'Cormorant Garamond';font-size:40px;color:var(--emd);display:block;line-height:1.05}

.chips{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.chip{border:1.5px solid var(--em);border-radius:12px;padding:8px 14px;font-size:16px;font-weight:600;color:var(--emd);background:#fff}
.chip b{color:var(--gold);font-size:20px;margin-left:6px}
.total{display:flex;align-items:center;gap:16px;margin-top:20px}
.mini{width:100%;border-collapse:collapse;font-size:17px}
.mini td,.mini th{padding:9px 10px;text-align:center;border-bottom:1.5px solid var(--line)}
.mini th{color:var(--gold);font-size:13px;letter-spacing:.14em;text-transform:uppercase}
.mini td{font-weight:600;color:var(--emd)}
.vcard{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:26px 26px 18px}
.vcard h3{font-family:'Cormorant Garamond';font-size:38px;margin:0;color:var(--emd)}
.vcard .sub{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:600;margin:2px 0 14px}
.kv{display:flex;justify-content:space-between;align-items:baseline;font-size:19px;padding:8px 0;border-top:1px solid var(--line)}
.kv b{color:var(--em);font-family:'Cormorant Garamond';font-size:32px;line-height:1}
.pat{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:16px 18px}
.pat .h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px}
.pat .h b{font-family:'Cormorant Garamond';font-size:27px;color:var(--emd)}

.steps{gap:14px} .step{padding:20px 24px!important}
.pat{padding:12px 18px!important}

.pd{display:block;font-family:'IBM Plex Sans',sans-serif;font-size:14px;font-weight:500;color:var(--mut);margin-top:2px}

.bgrid{gap:16px}
.bon{padding:14px 18px}
.bon .hand.xs svg.t{width:29px;height:39.6px} .bon .hand.xs svg.side{width:39.6px;height:29px}
.bon .hand{gap:6px 9px}
.pill{white-space:nowrap}
.bh .pill{flex:none}
.bh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bh b{display:block;font-family:'Cormorant Garamond';font-size:27px;color:var(--emd);line-height:1.05}
.bh .cn{display:block;font-size:12.5px;letter-spacing:.06em;color:var(--gold);font-weight:600;margin-top:3px}
.bv{margin:12px 0 4px;min-height:58px;display:flex;align-items:center}
.bon .cap{font-size:15px;margin-top:6px}
.flow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.mini-t{font-size:14px;color:var(--mut);font-weight:600}
.win{border:2.5px solid var(--red);border-radius:10px;padding:4px 6px 0}

:root{--seal:#c0392b;--sealbg:#fff1ec}
.khas{position:relative;border:2.5px solid var(--seal)!important;background:var(--sealbg)!important}
.stamp{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:10px;background:var(--seal);color:#fff;border-radius:10px;padding:7px 14px 7px 10px;
  font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;transform:rotate(-3deg);box-shadow:0 4px 0 #8e2a1f}
.stamp .ch{font-family:'Noto Serif CJK TC',serif;font-size:20px;letter-spacing:0;background:#fff;color:var(--seal);border-radius:6px;padding:0 6px;line-height:1.35}
.khas .stamp{position:absolute;top:-18px;right:18px}
.vs{font-size:15px;color:#8e2a1f;margin-top:10px;line-height:1.4}
.vs b{font-weight:600}
.legend{display:flex;align-items:center;gap:16px;background:#fff;border:1.5px dashed var(--seal);border-radius:16px;padding:14px 18px;margin-top:4px}
.cover .legend{position:absolute;left:90px;right:90px;bottom:120px;background:rgba(255,255,255,.08);border-color:#e7a497;color:#f6e7da;font-size:18px}
.cmp{width:100%;border-collapse:separate;border-spacing:0;font-size:17px}
.cmp th,.cmp td{padding:13px 12px;text-align:left;border-bottom:1.5px solid var(--line);vertical-align:top}
.cmp th{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.cmp td:first-child{font-weight:600;color:var(--emd);width:150px}
.cmp .hk{background:var(--sealbg);border-left:2.5px solid var(--seal);border-right:2.5px solid var(--seal);font-weight:600;color:#8e2a1f}
.cmp thead .hk{background:var(--seal);color:#fff;border-radius:12px 12px 0 0}
.cmp tr:last-child .hk{border-bottom:2.5px solid var(--seal)}

:root{--goldtx:#86671f}
.top{color:var(--goldtx)}
.tag{font-size:14px;color:var(--goldtx)}

/* Layout: one A5 page scaled to the column, control bar above, spotlight list beside on wide screens */
:root{--em:#6b3f1d;--emd:#0d3f2f;--iv:#fbf7ec;--gold:#b08d3c;--ink:#22241f;--mut:#6d6a5e;--seal:#1d4ed8;--line:#e3d9bf;--paper:#efe8d6;color-scheme:light}
html,body{background:var(--paper);color:var(--ink);margin:0}
.app{max-width:1180px;margin:0 auto;padding-left:16px;padding-right:16px;padding-block:20px 40px;font-family:'IBM Plex Sans',system-ui,sans-serif}
.head{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;margin-bottom:16px}
.head h2{font-family:'Cormorant Garamond',Georgia,serif;font-size:30px;color:var(--em);margin:0;line-height:1.1}
.head small{display:block;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:2px}
.spotbtn{display:inline-flex;align-items:center;gap:10px;border:2px solid var(--seal);background:#fff;color:var(--seal);font:600 15px 'IBM Plex Sans',sans-serif;border-radius:99px;padding:9px 18px;cursor:pointer}
.spotbtn[aria-pressed="true"]{background:var(--seal);color:#fff}
.spotbtn .ch{font-family:'Noto Serif TC',serif;background:var(--seal);color:#fff;border-radius:6px;padding:0 6px}
.spotbtn[aria-pressed="true"] .ch{background:#fff;color:var(--seal)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:minmax(0,1fr)}}
.stage{min-width:0}
.stagebox{position:relative;width:100%;overflow:hidden;border-radius:10px;box-shadow:0 18px 40px -24px rgba(40,32,16,.55);background:var(--iv)}
.stagebox .pgwrap{transform-origin:0 0;width:874px}
.nav{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-top:14px}
@media (max-width:700px){.nav .dots{order:-1;width:100%}}
.nav button{border:1.5px solid var(--em);background:#fff;color:var(--em);font:600 15px 'IBM Plex Sans',sans-serif;border-radius:10px;padding:9px 16px;cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.dot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:#fff;font:600 12px 'IBM Plex Sans',sans-serif;color:var(--mut);cursor:pointer;position:relative}
.dot.on{background:var(--em);border-color:var(--em);color:#fff}
.dot.hk::after{content:'';position:absolute;top:-2px;right:-2px;width:9px;height:9px;border-radius:50%;background:var(--seal);border:2px solid var(--paper)}
.side{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:18px}
.side h3{font-family:'Cormorant Garamond',Georgia,serif;font-size:24px;color:var(--emd);margin:0 0 4px}
.side p{font-size:14px;color:var(--mut);margin:0 0 12px;line-height:1.5}
.side ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.side li button{width:100%;text-align:left;display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--iv);border-radius:10px;padding:9px 10px;cursor:pointer;font:500 14px 'IBM Plex Sans',sans-serif;color:var(--ink)}
.side li button:hover,.side li button.cur{border-color:var(--seal);background:color-mix(in srgb,var(--seal) 8%,#fff)}
.side .pgn{font:600 11px 'IBM Plex Sans',sans-serif;color:#fff;background:var(--seal);border-radius:6px;padding:2px 6px;flex:none}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
/* spotlight: dim everything that is not a Hong Kong distinction */
.spot .pg > :not(.top):not(h1):not(.foot):not(.khas):not(:has(.khas)):not(.legend):not(.ct):not(.fan):not(.frame){opacity:.55;filter:saturate(.5);transition:opacity .25s}
.spot .pg .steps > .step:not(.khas){opacity:.55;filter:saturate(.5)}
.spot .pg .cmp td:not(.hk):not(:first-child),.spot .pg .cmp th:not(.hk){opacity:.55}
.spot .pg .khas{box-shadow:0 0 0 6px color-mix(in srgb,var(--seal) 22%,transparent)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.note{font-size:13px;color:var(--mut);margin-top:12px}
</style>

div class=\"cap\" style=\"margin-top:0\">Ubin di <b>kiri</b> potongan. Dealer ambil 2 tumpuk pertama (kotak), lalu pemain berikutnya, terus ke kiri.</div><div class=\"chips\" style=\"margin-top:10px;gap:6px\"><span class=\"chip\" style=\"font-size:14px;padding:5px 10px\">3 \u00d7 4 ubin</span><span class=\"chip\" style=\"font-size:14px;padding:5px 10px\">dealer +2</span><span class=\"chip\" style=\"font-size:14px;padding:5px 10px\">lain +1</span></div><div class=\"cap\" style=\"margin-top:8px;font-weight:600;color:var(--emd)\">Dealer 14 \u00b7 lain 13</div></div><div class=\"card\" style=\"padding:16px 20px;border-color:var(--seal)\"><h3 style=\"font-size:26px;color:var(--seal)\">Buntut: ujung akhir</h3><div class=\"cap\" style=\"margin-top:0\">Ubin di <b>kanan</b> potongan. Tidak dipakai untuk ubin pengganti. Tembok diambil terus sampai habis.</div></div></div><div class=\"card khas\"><span class=\"stamp\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><h3 style=\"font-size:26px\">Tidak ada ubin pengganti</h3><div class=\"cap\" style=\"margin-top:0\">Kong, Quint, dan Sextet sudah dihitung di dalam 14 ubin, jadi tidak ada ubin pengganti dan tidak ada tembok mati. Kalau tembok habis tanpa pemenang, permainan seri (<i>wall game</i>) dan tidak ada yang membayar.</div><div class=\"vs\"><b>Bedanya:</b> varian lain memilih tembok dengan dadu dan mengambil ubin pengganti dari buntut.</div></div><div class=\"foot\">American \u00b7 Mahjong Quick Guide \u00b7 Jade Mahjong</div></section>", "<section class=\"pg \"><div class=\"top\"><span class=\"k\">Langkah 6</span><span class=\"pn\">07</span></div><h1>Charleston: tukar ubin</h1><div class=\"card khas\"><span class=\"stamp\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><h3>Charleston pertama: wajib</h3><div class=\"cap\" style=\"margin-top:0\">Sebelum main, setiap pemain mengoper 3 ubin, tiga kali.</div><div class=\"grid3\" style=\"gap:12px;margin-top:12px\"><div class=\"card\" style=\"text-align:center;padding:16px\"><div class=\"tag\" style=\"margin:0 0 6px\">Oper 1</div><div class=\"big\" style=\"font-size:64px;color:var(--seal)\">\u2192</div><div class=\"cap\" style=\"margin:4px 0 0;font-weight:600;color:var(--emd)\">3 ubin ke kanan</div></div><div class=\"card\" style=\"text-align:center;padding:16px\"><div class=\"tag\" style=\"margin:0 0 6px\">Oper 2</div><div class=\"big\" style=\"font-size:64px;color:var(--seal)\">\u2191</div><div class=\"cap\" style=\"margin:4px 0 0;font-weight:600;color:var(--emd)\">3 ubin ke seberang</div></div><div class=\"card\" style=\"text-align:center;padding:16px\"><div class=\"tag\" style=\"margin:0 0 6px\">Oper 3</div><div class=\"big\" style=\"font-size:64px;color:var(--seal)\">\u2190</div><div class=\"cap\" style=\"margin:4px 0 0;font-weight:600;color:var(--emd)\">3 ubin ke kiri</div></div></div><div class=\"vs\"><b>Bedanya:</b> Hong Kong, Riichi, MCR, dan Taiwan tidak menukar ubin sebelum main.</div></div><div style=\"height:24px\"></div><div class=\"grid2\" style=\"gap:14px\"><div class=\"card\"><h3>Charleston kedua</h3><div class=\"flow\" style=\"gap:10px;margin:6px 0\"><span class=\"pill\">\u2190 kiri</span><span class=\"pill\">\u2191 seberang</span><span class=\"pill\">\u2192 kanan</span></div><div class=\"cap\">Opsional. Hanya jika semua pemain setuju. Urutannya terbalik.</div></div><div class=\"card\"><h3>Oper sopan</h3><div class=\"flow\" style=\"gap:10px;margin:6px 0\"><span class=\"pill gold\">0\u20133 ubin</span><span class=\"pill gold\">\u2191 seberang</span></div><div class=\"cap\">Courtesy pass dengan pemain di seberang, sesuai kesepakatan berdua.</div></div></div><div class=\"band\" style=\"margin-top:20px;display:flex;gap:18px;align-items:center\"><span class=\"pill gold\">Ingat</span><span style=\"font-size:18px\">Joker tidak boleh dioper. Oper buta (meneruskan ubin yang baru diterima tanpa dilihat) boleh di oper terakhir setiap Charleston.</span></div><div class=\"foot\">American \u00b7 Mahjong Quick Guide \u00b7 Jade Mahjong</div></section>", "<section class=\"pg \"><div class=\"top\"><span class=\"k\">Langkah 7</span><span class=\"pn\">08</span></div><h1>Satu giliran</h1><div class=\"steps\"><div class=\"step\"><div class=\"num\">1</div><div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\"><div><b>Ambil 1 ubin</b><div class=\"cap\">Ambil dari tembok. Giliran pertama dealer: langsung buang, karena sudah 14 ubin.</div></div><div class=\"hand xs\"><span class=\"g\"><svg class=\"t\" viewBox=\"0 0 60 82\" role=\"img\" aria-label=\"Punggung ubin\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"80\" rx=\"7.5\" fill=\"#cbbf9f\"/><rect x=\"1\" y=\"1\" width=\"58\" height=\"72\" rx=\"7.5\" fill=\"#2f6e4e\" stroke=\"#1d4330\"/><rect x=\"1.5\" y=\"1.5\" width=\"57\" height=\"20\" rx=\"7\" fill=\"#3c8460\"/><rect x=\"1.5\" y=\"12\" width=\"57\" height=\"20\" fill=\"#357a57\"/><rect x=\"5\" y=\"5\" width=\"50\" height=\"64\" rx=\"5\" fill=\"none\" stroke=\"#a6dcbd\" stroke-width=\"1.1\" opacity=\".6\"/></svg></span></div></div></div><div class=\"step khas\" style=\"position:relative\"><span class=\"stamp\" style=\"position:absolute;top:-18px;right:18px\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><div class=\"num\">2</div><div style=\"display:flex;justify-content:space-between;align-items:center;gap:16px\"><div><b>Tukar joker?</b><div class=\"cap\">Di giliran Anda, tukar ubin asli dengan joker di set terbuka pemain mana pun.</div></div><div class=\"hand xs\"><span class=\"g\"><svg class=\"t\" viewBox=\"0 0 60 82\" role=\"img\" aria-label=\"Joker\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"80\" rx=\"7.5\" fill=\"#cfc3a2\" stroke=\"#b8ab86\"/><rect x=\"1\" y=\"1\" width=\"58\" height=\"75\" rx=\"7.5\" fill=\"#efe7d3\" stroke=\"#c4b896\"/><rect x=\"3.2\" y=\"3.2\" width=\"53.6\" height=\"70\" rx=\"5.6\" fill=\"#fdfaf1\" stroke=\"#e6ddc4\"/><rect x=\"9\" y=\"12\" width=\"42\" height=\"52\" rx=\"4\" fill=\"none\" stroke=\"#a62f20\" stroke-width=\"1.6\"/><text  style=\"margin-bottom:24px\"><h3>Yang tidak boleh diambil</h3><div class=\"cap\" style=\"font-size:18px\">Pasangan dan ubin tunggal tidak boleh diambil dari buangan, kecuali untuk menang. Joker yang dibuang mati: tidak bisa diambil siapa pun.</div></div><div class=\"card khas\"><span class=\"stamp\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><h3>Tangan mati</h3><div class=\"cap\" style=\"font-size:18px;margin-top:0\">Tangan yang tidak mungkin lagi cocok dengan pola kartu, jumlah ubinnya salah, atau salah membuka set. Pemain berhenti bermain, tetapi <b>tetap membayar</b> kalau ada pemenang.</div><div class=\"vs\"><b>Bedanya:</b> di varian lain pemain yang salah biasanya tetap main tetapi tidak boleh menang, kadang ditambah denda.</div></div><div class=\"foot\">American \u00b7 Mahjong Quick Guide \u00b7 Jade Mahjong</div></section>", "<section class=\"pg \"><div class=\"top\"><span class=\"k\">Hitung skor</span><span class=\"pn\">10</span></div><h1>Dari kartu ke pembayaran</h1><div class=\"card khas\"><span class=\"stamp\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><h3>Nilai tertulis di kartu</h3><div class=\"cap\" style=\"font-size:18px;margin-top:0\">Tidak perlu menghitung pola: nilai tangan sudah tertera di kartu NMJL.</div><div class=\"vs\"><b>Bedanya:</b> varian lain menghitung faan, tai, atau poin dari isi tangan.</div></div><div style=\"height:24px\"></div><div class=\"card\"><h3>Siapa yang membayar?</h3><div class=\"grid2\" style=\"gap:14px\"><div><span class=\"pill\">Menang dari buangan</span><div class=\"cap\">Pembuang bayar 2\u00d7 nilai kartu. Dua pemain lain bayar 1\u00d7.</div></div><div><span class=\"pill gold\">Tarikan sendiri</span><div class=\"cap\">Ketiga pemain masing-masing bayar 2\u00d7.</div></div></div></div><div style=\"height:24px\"></div><div class=\"band\"><h3 style=\"font-family:'Cormorant Garamond';font-size:30px;margin:0 0 8px;color:var(--emd)\">Contoh: pola bernilai 25</h3><table class=\"mini\"><tr><th></th><th>Pembuang</th><th>Pemain lain</th><th>Total diterima</th></tr><tr><th style=\"text-align:left\">Dari buangan</th><td>50</td><td>25 + 25</td><td>100</td></tr><tr><th style=\"text-align:left\">Tarikan sendiri</th><td>\u2013</td><td>50 \u00d7 3</td><td>150</td></tr><tr><th style=\"text-align:left\">Tarikan sendiri, tanpa joker</th><td>\u2013</td><td>100 \u00d7 3</td><td>300</td></tr></table><div class=\"cap\">Tanpa joker: nilai \u00d72 dan harus diumumkan. Tidak berlaku untuk pola yang memang melarang joker.</div></div><div class=\"foot\">American \u00b7 Mahjong Quick Guide \u00b7 Jade Mahjong</div></section>", "<section class=\"pg \"><div class=\"top\"><span class=\"k\">Situasi khusus</span><span class=\"pn\">11</span></div><h1>Situasi khusus</h1><div class=\"grid2 bgrid\"><div class=\"card bon khas\" style=\"position:relative\"><span class=\"stamp\" style=\"position:absolute;top:-18px;right:18px\"><span class=\"ch\">\u7f8e</span>Khas Amerika</span><div class=\"bh\"><div><b>Tanpa joker</b><span class=\"cn\">Jokerless</span></div><span class=\"pill\">nilai \u00d72</span></div><div class=\"bv\"><div class=\"flow\"><div class=\"hand xs\"><span class=\"g\"><svg class=\"t\" viewBox=\"0 0 60 82\" role=\"img\" aria-label=\"Naga Merah\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"80\" rx=\"7.5\" fill=\"#cfc3a2\" stroke=\"#b8ab86\"/><rect x=\"1\" y=\"1\" width=\"58\" height=\"75\" rx=\"7.5\" fill=\"#efe7d3\" stroke=\"#c4b896\"/><rect x=\"3.2\" y=\"3.2\" width=\"53.6\" height=\"70\" rx=\"5.6\" fill=\"#fdfaf1\" stroke=\"#e6ddc4\"/><text x=\"30\" y=\"53\" text-anchor=\"middle\" font-family=\"Noto Serif CJK TC, Noto Serif TC, serif\" font-weight=\"700\" font-size=\"40\" fill=\"#a62f20\">\u4e2d</text></svg><svg class=\"t\" viewBox=\"0 0 60 82\" role=\"img\" aria-label=\"Naga Merah\"><rect x=\"1\" y=\"1\" width=\"58\" height=\"80\" rx=\"7.5\" fill=\"#cfc3a2\" stroke=\"#b8ab86\"/><rect x=\"1\" y=\"1\" width=\"58\" height=\"75\" rx=\"7.5\" fill=\"#efe7d3\" stroke=\"#c4b896\"/><rect x=\"3.2\" y <script>
const h = React.createElement;
const {useState, useRef, useLayoutEffect, useEffect} = React;
function useScale(ref){
  const [s,setS] = useState(1);
  useLayoutEffect(()=>{
    const el = ref.current; if(!el) return;
    const ro = new ResizeObserver(()=> setS(Math.min(1, el.clientWidth/874)));
    ro.observe(el); setS(Math.min(1, el.clientWidth/874));
    return ()=>ro.disconnect();
  },[]);
  return s;
}
function App(){
  const [i,setI] = useState(0);

    const f = e => { if(e.key==='ArrowRight') setI(x=>Math.min(PAGES.length-1,x+1)); if(e.key==='ArrowLeft') setI(x=>Math.max(0,x-1)); };
